<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aidel TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c0c10;
      color: #fff;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      padding-bottom: 75px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: #14141a;
    }
    .logo { font-size: 22px; font-weight: 800; color: #ff2a2a; }
    .logo span { color: #fff; }

    /* Search */
    .search-box { padding: 10px 14px 6px; }
    input#search {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 12px;
      background: #1c1c24;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    /* Hero */
    .hero {
      margin: 10px 14px;
      padding: 26px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8b0000, #1a1a24);
    }
    .hero .eyebrow { font-size: 12px; letter-spacing: 1px; opacity: 0.85; }
    .hero h1 { font-size: 24px; margin: 6px 0 8px; }
    .hero p { color: #ddd; font-size: 14px; margin-bottom: 14px; }
    .btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* Sections */
    section { padding: 16px 14px 4px; }
    h2 { font-size: 17px; margin-bottom: 12px; font-weight: 700; }
    .row {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .row::-webkit-scrollbar { display: none; }
    .empty { color: #777; font-size: 13px; }

    /* Cards */
    .card { min-width: 118px; width: 118px; cursor: pointer; }
    .card img {
      width: 118px;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      background: #1f1f28;
      display: block;
    }
    .card .title {
      font-size: 12.5px;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .card .meta { font-size: 11px; color: #999; margin-top: 2px; }

    /* Bottom navigation */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 12px;
      background: #14141a;
      border-top: 1px solid #222;
    }
    nav button {
      background: none;
      border: none;
      color: #888;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    nav button.active { color: #ff2a2a; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-box {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      background: #16161e;
    }
    .modal-img { width: 100%; height: 240px; object-fit: cover; background: #1f1f28; }
    .modal-body { padding: 18px 16px 30px; }
    .modal-body h3 { font-size: 20px; margin-bottom: 4px; }
    .modal-meta { color: #aaa; font-size: 13px; margin-bottom: 12px; }
    .modal-desc { font-size: 14px; line-height: 1.55; color: #ccc; margin-bottom: 18px; }
    .modal-body .btn { width: 100%; padding: 13px; }
    .close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AIDEL <span>TV</span></div>
  </header>

  <div class="search-box">
    <input id="search" type="search" placeholder="Search movies & series...">
  </div>

  <main>
    <div class="hero">
      <div class="eyebrow">WELCOME TO AIDEL TV</div>
      <h1>Unlimited Movies & Series</h1>
      <p>Nollywood • Hollywood • Comedy • Action</p>
      <button class="btn" id="explore-btn">▶ Explore Now</button>
    </div>

    <section id="trending">
      <h2>🔥 Trending Now</h2>
      <div class="row" id="trending-row"></div>
    </section>

    <section id="nollywood">
      <h2>🇳🇬 Nollywood</h2>
      <div class="row" id="nollywood-row"></div>
    </section>

    <section id="action">
      <h2>💥 Action</h2>
      <div class="row" id="action-row"></div>
    </section>

    <section id="comedy">
      <h2>😂 Comedy</h2>
      <div class="row" id="comedy-row"></div>
    </section>

    <section id="series">
      <h2>📺 Popular Series</h2>
      <div class="row" id="series-row"></div>
    </section>
  </main>

  <nav>
    <button class="active" data-target="top">⌂<br>Home</button>
    <button data-target="trending">▶<br>Movies</button>
    <button data-target="series">▣<br>Series</button>
  </nav>

  <!-- Movie details modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="close" id="close-btn" aria-label="Close">×</button>
      <img id="m-img" class="modal-img" alt="">
      <div class="modal-body">
        <h3 id="m-title"></h3>
        <div class="modal-meta" id="m-meta"></div>
        <p class="modal-desc" id="m-desc"></p>
        <button class="btn" id="m-play">▶ Watch Trailer</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIGURATION =====
    // Paste your TMDB API key between the quotes below.
    const TMDB_API_KEY = "PASTE_YOUR_KEY_HERE";
    const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w500";
    const POSTER_PLACEHOLDER =
      "https://placehold.co/300x450/1f1f28/ffffff?text=Poster+Unavailable";

    // ===== CATALOG =====
    // sections: which rows the title appears in
    const catalog = [
      { title: "A Tribe Called Judah", year: 2023, type: "movie", genre: "Comedy • Crime",
        sections: ["trending", "nollywood", "comedy"],
        desc: "Five brothers from different mothers unite for one big heist to save their dying mother." },
      { title: "The Black Book", year: 2023, type: "movie", genre: "Action • Thriller",
        sections: ["trending", "nollywood", "action"],
        desc: "A lawyer seeks justice after a personal tragedy and uncovers a dark conspiracy." },
      { title: "King of Boys", year: 2018, type: "movie", genre: "Crime • Drama",
        sections: ["nollywood", "action"],
        desc: "A powerful businesswoman navigates the dangerous world of Nigerian politics and crime." },
      { title: "Aníkúlápó", year: 2022, type: "movie", genre: "Fantasy • Drama",
        sections: ["nollywood", "trending"],
        desc: "A man discovers a mystical power that allows him to bring the dead back to life." },
      { title: "The Wedding Party", year: 2016, type: "movie", genre: "Comedy • Romance",
        sections: ["nollywood", "comedy"],
        desc: "A glamorous Lagos wedding full of drama, secrets and laughter." },
      { title: "Extraction 2", year: 2023, type: "movie", genre: "Action",
        sections: ["trending", "action"],
        desc: "Tyler Rake returns for another high-octane rescue mission." },
      { title: "John Wick: Chapter 4", year: 2023, type: "movie", genre: "Action",
        sections: ["trending", "action"],
        desc: "John Wick uncovers a path to defeating The High Table once and for all." },
      { title: "Barbie", year: 2023, type: "movie", genre: "Comedy • Fantasy",
        sections: ["trending", "comedy"],
        desc: "Barbie and Ken are having the time of their lives in the colorful world of Barbie Land." },
      { title: "Mission: Impossible – Dead Reckoning", year: 2023, type: "movie", genre: "Action",
        sections: ["action", "trending"],
        desc: "Ethan Hunt and his team face their most dangerous mission yet." },
      { title: "Fast X", year: 2023, type: "movie", genre: "Action",
        sections: ["action"],
        desc: "Dom Toretto and his family are targeted by the vengeful son of drug kingpin Hernan Reyes." },
      { title: "The Equalizer 3", year: 2023, type: "movie", genre: "Action • Thriller",
        sections: ["action"],
        desc: "Robert McCall finds himself in Southern Italy and helps protect his friends from the local mafia." },
      { title: "Stranger Things", year: 2016, type: "tv", genre: "Sci-Fi • Horror",
        sections: ["series", "trending"],
        desc: "When a young boy vanishes, a small town uncovers a mystery involving secret experiments and supernatural forces." },
      { title: "The Last of Us", year: 2023, type: "tv", genre: "Drama • Action",
        sections: ["series"],
        desc: "Joel and Ellie navigate a post-apocalyptic world while being hunted by infected and other survivors." },
      { title: "House of the Dragon", year: 2022, type: "tv", genre: "Fantasy • Drama",
        sections: ["series"],
        desc: "The story of House Targaryen set 200 years before the events of Game of Thrones." }
    ];

    // ===== POSTERS =====
    // Looks up each title on TMDB and stores the poster URL on the item.
    async function fetchPoster(item) {
      if (!TMDB_API_KEY || TMDB_API_KEY === "a7d2938484965708730e68b1f62e5236" {
        item.poster = POSTER_PLACEHOLDER;
        return;
      }

      try {
        const kind = item.type === "tv" ? "tv" : "movie";
        const params = new URLSearchParams({
          api_key: TMDB_API_KEY,
          query: item.title,
          include_adult: "false"
        });
        params.set(kind === "tv" ? "first_air_date_year" : "year", item.year);

        const res = await fetch(`https://api.themoviedb.org/3/search/${kind}?${params}`);
        if (!res.ok) throw new Error("TMDB responded " + res.status);

        const data = await res.json();
        const hit = (data.results || []).find(r => r.poster_path);
        item.poster = hit ? TMDB_IMAGE_BASE + hit.poster_path : POSTER_PLACEHOLDER;
      } catch (err) {
        console.warn("Poster lookup failed for " + item.title, err);
        item.poster = POSTER_PLACEHOLDER;
      }
    }

    // ===== RENDERING =====
    const rows = {
      trending: document.getElementById("trending-row"),
      nollywood: document.getElementById("nollywood-row"),
      action: document.getElementById("action-row"),
      comedy: document.getElementById("comedy-row"),
      series: document.getElementById("series-row")
    };

    function createCard(item) {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = item.poster || POSTER_PLACEHOLDER;
      img.alt = item.title + " poster";
      img.loading = "lazy";
      img.onerror = function () {
        this.onerror = null;
        this.src = POSTER_PLACEHOLDER;
      };

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.title;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = item.year;

      card.append(img, title, meta);
      card.addEventListener("click", () => openModal(item));
      return card;
    }

    function render() {
      Object.values(rows).forEach(row => (row.innerHTML = ""));

      catalog.forEach(item => {
        item.sections.forEach(section => {
          if (rows[section]) rows[section].appendChild(createCard(item));
        });
      });

      // Show a note in any empty row
      Object.values(rows).forEach(row => {
        if (!row.children.length) {
          row.innerHTML = '<p class="empty">Nothing here yet.</p>';
        }
      });
    }

    // ===== SEARCH =====
    document.getElementById("search").addEventListener("input", e => {
      const query = e.target.value.trim().toLowerCase();
      document.querySelectorAll(".card").forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? "" : "none";
      });
    });

    // ===== MODAL =====
    const modal = document.getElementById("modal");

    function openModal(item) {
      const img = document.getElementById("m-img");
      img.src = item.poster || POSTER_PLACEHOLDER;
      img.onerror = function () {
        this.onerror = null;
        this.src = POSTER_PLACEHOLDER;
      };

      document.getElementById("m-title").textContent = item.title;
      document.getElementById("m-meta").textContent = `${item.year} • ${item.genre}`;
      document.getElementById("m-desc").textContent = item.desc;

      // Opens a YouTube search for the official trailer
      document.getElementById("m-play").onclick = () => {
        const q = encodeURIComponent(`${item.title} ${item.year} official trailer`);
        window.open(`https://www.youtube.com/results?search_query=${q}`, "_blank", "noopener");
      };

      modal.classList.add("show");
    }

    function closeModal() {
      modal.classList.remove("show");
    }

    document.getElementById("close-btn").addEventListener("click", closeModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    // ===== NAVIGATION =====
    function scrollToTarget(target) {
      if (target === "top") {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        document.getElementById(target).scrollIntoView({ behavior: "smooth" });
      }
    }

    document.getElementById("explore-btn").addEventListener("click", () => scrollToTarget("trending"));

    document.querySelectorAll("nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        scrollToTarget(btn.dataset.target);
      });
    });

    // ===== START =====
    async function start() {
      catalog.forEach(item => (item.poster = POSTER_PLACEHOLDER));
      render();                                    // show cards right away

      await Promise.all(catalog.map(fetchPoster)); // then swap in real posters
      render();
    }

    start();
  </script>
</body>
 </html>

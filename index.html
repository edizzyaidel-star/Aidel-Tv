<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0c10;color:white;font-family:system-ui,-apple-system,Arial,sans-serif}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#14141a;position:sticky;top:0;z-index:50}
.logo{font-size:22px;font-weight:800;color:#ff2a2a;letter-spacing:-0.5px}
.logo span{color:#fff}
.search-box{padding:10px 16px 6px}
input{width:100%;padding:12px 15px;border-radius:12px;border:none;background:#1c1c24;color:white;font-size:15px;outline:none}
.hero{margin:10px 14px;padding:26px 18px;border-radius:16px;background:linear-gradient(135deg,#8b0000 0%,#1a1a24 100%);position:relative;overflow:hidden}
.hero h1{font-size:24px;margin:6px 0 8px;line-height:1.2}
.hero p{color:#ddd;font-size:14px;margin-bottom:14px}
.btn{background:#e50914;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
section{padding:16px 14px 4px}
h2{font-size:17px;margin-bottom:12px;font-weight:700}
.row{display:flex;gap:11px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.card{min-width:118px;width:118px;cursor:pointer}
.card img{width:118px;height:170px;object-fit:cover;border-radius:10px;background:#1f1f28;display:block}
.card .title{font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.card .meta{font-size:11px;color:#999;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:#14141a;display:flex;justify-content:space-around;padding:10px 0 12px;border-top:1px solid #222;z-index:50}
nav button{background:none;border:none;color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{color:#ff2a2a}
main{padding-bottom:75px}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#16161e;width:100%;max-width:480px;border-radius:20px 20px 0 0;overflow:hidden;max-height:90vh;overflow-y:auto}
.modal-img{width:100%;height:240px;object-fit:cover}
.modal-body{padding:18px 16px 30px}
.modal-body h3{font-size:20px;margin-bottom:4px}
.modal-meta{color:#aaa;font-size:13px;margin-bottom:12px}
.modal-desc{font-size:14px;line-height:1.55;color:#ccc;margin-bottom:18px}
.close{position:absolute;top:12px;right:14px;background:rgba(0,0,0,0.6);border:none;color:white;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}

<body>

  <section>

  <section>
    <h2>📺 Popular Series</h2>

  </section>
</main>

<nav>
  <button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂<br>Home</button>
  <button onclick="document.getElementById('trending').scrollIntoView({behavior:'smooth'})">▶<br>Movies</button>
  <button onclick="alert('More series coming soon!')">▣<br>Series</button>
  <button onclick="alert('Account section coming soon!')">●<br>Account</button>

<!-- Movie Modal -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">

    <button class="close" onclick="closeModal()">×</button>

// ========== RENDER ==========
function createCard(m) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <img src="\( {m.poster}" alt=" \){m.title}" loading="lazy" onerror="this.src='https://placehold.co/300x450/1f1f28/666?text=No+Poster'">
    <div class="title">${m.title}</div>
    <div class="meta">${m.year}</div>
  `;
  div.onclick = () => openModal(m);
  return div;
}

function render() {
  const map = {
    trending: document.getElementById("trending-row"),
    nollywood: document.getElementById("nollywood-row"),
    action: document.getElementById("action-row"),
    comedy: document.getElementById("comedy-row"),
    series: document.getElementById("series-row")
  };
  Object.values(map).forEach(r => r.innerHTML = "");
  movies.forEach(m => {
    m.cats.forEach(c => {
      if (map[c]) map[c].appendChild(createCard(m));
    });
  });
}

function filterMovies() {
  const q = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(q) ? "block" : "none";
  });
}

function openModal(m) {
  document.getElementById("m-img").src = m.poster;
  document.getElementById("m-title").textContent = m.title;
  document.getElementById("m-meta").textContent = `${m.year}  •  ${m.genre}`;
  document.getElementById("m-desc").textContent = m.desc;
  document.getElementById("m-play").onclick = () => window.open(m.link, "_blank");
  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

render();

// ========== RENDER =========
const TMDB_API_KEY = "9dbc1b7e75976aa5c66a8bdba4e753ce"

const TMDB_IMAGE_URL = "https://image.tmdb.org/t/p/w500";

const POSTER_PLACEHOLDER =
  "https://placehold.co/300x450/1f1f28/ffffff?text=Poster+Unavailable";


// 2. SEARCH TMDB FOR THE CORRECT POSTER
async function getMoviePoster(movie) {
  try {
    // Detect whether the item is a TV series
    const isSeries = movie.cats.includes("series");

    const mediaType = isSeries ? "tv" : "movie";

    const searchParams = new URLSearchParams({
      api_key: TMDB_API_KEY,
      query: movie.title,
      include_adult: "false"
    });

    // Search using the movie's release year
    const year = parseInt(movie.year, 10);

    if (Number.isFinite(year)) {
      searchParams.set(
        isSeries ? "first_air_date_year" : "year",
        year
      );
    }

    const response = await fetch(
      `https://api.themoviedb.org/3/search/${mediaType}?${searchParams}`
    );

    if (!response.ok) {
      throw new Error("TMDB error: " + response.status);
    }

    const data = await response.json();

    if (data.results && data.results.length > 0) {

      // Prefer a result that has an official poster
      const result = data.results.find(
        item => item.poster_path
      );

      if (result) {
        movie.poster =
          TMDB_IMAGE_URL + result.poster_path;

        return movie.poster;
      }
    }

    movie.poster = POSTER_PLACEHOLDER;

    return movie.poster;

  } catch (error) {
    console.error(
      "Unable to load poster for " + movie.title,
      error
    );

    movie.poster = POSTER_PLACEHOLDER;

    return movie.poster;
  }
}


// 3. CREATE MOVIE POSTER CARDS
function createCard(movie) {

  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");

  img.src = movie.poster || POSTER_PLACEHOLDER;
  img.alt = movie.title + " official movie poster";
  img.loading = "lazy";

  img.onerror = function() {
    this.onerror = null;
    this.src = POSTER_PLACEHOLDER;
  };

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = movie.title;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = movie.year;

  card.appendChild(img);
  card.appendChild(title);
  card.appendChild(meta);

  card.onclick = () => openModal(movie);

  return card;
}


// 4. DISPLAY MOVIES IN THEIR CATEGORIES
function render() {

  const sections = {
    trending: document.getElementById("trending-row"),
    nollywood: document.getElementById("nollywood-row"),
    action: document.getElementById("action-row"),
    comedy: document.getElementById("comedy-row"),
    series: document.getElementById("series-row")
  };

  Object.values(sections).forEach(section => {
    if (section) section.innerHTML = "";
  });

  movies.forEach(movie => {

    movie.cats.forEach(category => {

      if (sections[category]) {
        sections[category].appendChild(
          createCard(movie)
        );
      }

    });

  });

}


// 5. LOAD ALL MOVIE POSTERS FROM TMDB
async function loadTMDBPosters() {

  if (
    !TMDB_API_KEY ||
    TMDB_API_KEY === "9dbc1b7e75976aa5c66a8bdba4e753ce"
  ) {
    console.error("9dbc1b7e75976aa5c66a8bdba4e753ce");
    return;
  }

  // Show movie cards immediately
  render();

  // Find posters for every movie and series
  await Promise.all(
    movies.map(movie => getMoviePoster(movie))
  );

  // Refresh the cards with their posters
  render();

  console.log("AIDEL TV: Movie posters loaded!");

}


// 6. SEARCH MOVIES
function filterMovies() {

  const search = document
    .getElementById("search")
    .value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {

    card.style.display =
      card.innerText.toLowerCase().includes(search)
        ? "block"
        : "none";

  });

}


// 7. OPEN MOVIE DETAILS
function openModal(movie) {

  const image = document.getElementById("m-img");

  image.src = movie.poster || POSTER_PLACEHOLDER;

  image.onerror = function() {
    this.onerror = null;
    this.src = POSTER_PLACEHOLDER;
  };

  document.getElementById("m-title").textContent =
    movie.title;

  document.getElementById("m-meta").textContent =
    movie.year + " • " + movie.genre;

  document.getElementById("m-desc").textContent =
    movie.desc;

  document.getElementById("m-play").onclick = () => {
    window.open(movie.link, "_blank");
  };

  document.getElementById("modal").classList.add("show");

}


// 8. CLOSE MOVIE DETAILS

  document.getElementById("modal")
